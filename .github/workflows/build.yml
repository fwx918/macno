name: Build macno

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop

      - name: Verify version
        id: version
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $version = $package.version
          if ($lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw "The package and lock file versions differ."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag must match app version v$version."
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      # --publish never: the release step below uploads the .exe artifacts;
      # without it electron-builder ALSO auto-publishes on tag builds (that's
      # where the stray latest.yml/.blockmap assets on past releases came from —
      # useless without an auto-updater in the app).
      - name: Build
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packages and write checksums
        env:
          MACNO_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $arguments = @{ Version = $env:MACNO_VERSION }
          if ($env:MACNO_VERSION -eq '1.1.0') {
            $previous = Join-Path $env:RUNNER_TEMP 'macno-1.0.4-win-x64.exe'
            Invoke-WebRequest -Uri 'https://github.com/fwx918/macno/releases/download/v1.0.4/macno-1.0.4-win-x64.exe' -OutFile $previous
            $arguments.UpgradeInstaller = $previous
          }
          ./tools/verify-packages.ps1 @arguments

      - uses: actions/upload-artifact@v4
        with:
          name: macno-windows-x64
          path: |
            release/macno-${{ steps.version.outputs.number }}-win-x64.exe
            release/macno-${{ steps.version.outputs.number }}-portable.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macno-windows-x64
          path: release
      - name: Upload verified packages to Release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            release/*.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
